name: Claude issue check

# Checks each new or edited issue against the repo conventions and comments
# only when something needs fixing. Read-only apart from that comment.

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

concurrency:
  group: claude-issue-check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Check issue #${{ github.event.issue.number }} in ${{ github.repository }} against the
            conventions in CLAUDE.md. Use `gh issue view` to read it.

            Verify:
            1. The title is `label:short description` with no space after the colon.
            2. It has exactly one label, and that label matches the title prefix.
            3. It states the problem or goal, and (for feature work) has a "Done when" checklist.
            4. Any "Depends on #N" references point to issues that exist.

            If everything passes, do nothing and post no comment.
            If anything fails, post ONE short comment listing each problem and the exact fix.
            Before posting, check whether you already left an equivalent comment on this issue;
            if so, don't post again. Never edit the issue, its title or its labels yourself.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 8
            --allowedTools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh label list:*),Bash(gh issue comment:*)"
        env:
          GH_TOKEN: ${{ github.token }}
